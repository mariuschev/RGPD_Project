<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heal The World — Mot de passe oublié</title>
  <style>
    :root{--bg:#0b1220;--card:rgba(255,255,255,.06);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.72);--border:rgba(255,255,255,.12);--primary:#2dd4bf;--primary2:#22c55e;--shadow:0 20px 50px rgba(0,0,0,.35);--radius:18px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);
      background:radial-gradient(1200px 700px at 10% 0%, rgba(34,197,94,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(45,212,191,.18), transparent 60%),
      linear-gradient(180deg,#070b14,var(--bg));min-height:100vh}
    a{color:inherit;text-decoration:none}
    .container{width:min(980px,92vw);margin:0 auto}
    header{border-bottom:1px solid var(--border);background:rgba(7,11,20,.6);backdrop-filter:blur(10px)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .logo{width:38px;height:38px;border-radius:12px;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 55%),linear-gradient(135deg,var(--primary),var(--primary2));border:1px solid rgba(255,255,255,.12)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-weight:650;font-size:14px;cursor:pointer}
    .btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
    .btn-primary{border-color:rgba(45,212,191,.35);background:linear-gradient(135deg, rgba(45,212,191,.28), rgba(34,197,94,.22))}
    main{padding:40px 0 60px}
    .wrap{width:min(520px,92vw);margin:0 auto}
    .card{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    h1{margin:0 0 6px;font-size:26px}
    p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
    label{font-size:13px;color:rgba(255,255,255,.82);font-weight:650}
    input{width:100%;padding:10px 12px;margin-top:6px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:var(--text);outline:none}
    input:focus{border-color:rgba(45,212,191,.5);box-shadow:0 0 0 6px rgba(45,212,191,.10)}
    .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
    .link{color:rgba(255,255,255,.86);text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="index.html"><div class="logo"></div><span>Heal The World</span></a>
      <a class="btn" href="login.html">Connexion</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="card">
        <h1>Mot de passe oublié</h1>
        <p>Saisissez votre email. Si un compte existe, un lien de réinitialisation sera envoyé (démo).</p>

        <form id="f" style="display:grid; gap:12px;">
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required />
          </div>
          <button class="btn btn-primary" type="submit">Envoyer le lien</button>
        </form>

        <div class="row">
          <a class="link" href="register.html">Créer un compte</a>
          <a class="link" href="privacy.html">Confidentialité</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("f").addEventListener("submit", (e)=>{
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if(!email.includes("@")) return alert("Email invalide.");
      alert("Email de réinitialisation envoyé (démo).");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
